name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run deterministic test suite
        shell: bash
        run: npm test
      - name: Verify generated CommonJS build is current
        shell: bash
        run: node scripts/build-cjs.mjs --check
      - name: Run strict TypeScript declaration check
        shell: bash
        run: node scripts/check-types.mjs
      - name: Run CLI smoke test
        shell: bash
        run: node scripts/cli-smoke.mjs
      - name: Run examples
        shell: bash
        run: |
          node examples/basic.mjs
          node examples/manifest-audit.mjs
          node examples/lockfile-audit.mjs
      - name: Inspect npm package dry run
        shell: bash
        run: npm pack --dry-run
      - name: Verify package tarball contents
        shell: bash
        run: node scripts/check-pack.mjs
